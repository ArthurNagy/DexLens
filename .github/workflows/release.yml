name: Release
on:
  push:
    tags: ['v*']
  # A dry run: builds and signs everything and keeps it as a workflow artifact, but publishes no Release.
  workflow_dispatch:

# Read-only by default; only the job that creates the Release gets write access.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
      # setup-gradle v6: its caching is the proprietary `gradle-actions-caching` component — using it
      # accepts Gradle's Terms of Use (https://gradle.com/legal/terms-of-use/). Pin `@v5` (MIT) instead
      # if your project can't accept them. https://blog.gradle.org/github-actions-for-gradle-v6
      - uses: gradle/actions/setup-gradle@v6
      # A tag that disagrees with the app's versionName would publish a Release whose APKs report another version.
      - name: Tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME, but app/build.gradle.kts has versionName $version. Bump it in a chore(release) commit first."
            exit 1
          fi
          # Checked here too, so a tag without notes fails before the long build rather than after it.
          if [ ! -s "docs/releases/$GITHUB_REF_NAME.md" ]; then
            echo "::error title=Missing release notes::Write docs/releases/$GITHUB_REF_NAME.md in the chore(release) pull request."
            exit 1
          fi
      - name: Signing secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      # Signs via AGP's injected signing properties (the same ones Android Studio's "Generate Signed
      # Bundle" uses) — no signingConfig in the app modules and no keystore path in the repo. Every
      # app module (:app and the form-factor apps :wear / :tv / :automotive) shares the upload key.
      # Two Gradle runs: AGP can't build an AAB while ABI splits are on (https://issuetracker.google.com/402800800).
      - name: Build signed release AABs (every app module)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew bundleRelease
          -Pandroid.injected.signing.store.file="$KEYSTORE_PATH"
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      # -PabiSplits adds an arm64-v8a APK (about half the size) next to the universal one, for sideloading.
      - name: Build signed release APKs (universal + arm64-v8a)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -PabiSplits=true
          -Pandroid.injected.signing.store.file="$KEYSTORE_PATH"
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Collect and verify artifacts
        run: |
          mkdir -p dist
          cp */build/outputs/bundle/release/*.aab */build/outputs/apk/release/*.apk dist/
          # R8 mappings retrace release stack traces; kept with the Release, one per module.
          for mapping in */build/outputs/mapping/release/mapping.txt; do cp "$mapping" "dist/${mapping%%/*}-mapping.txt"; done
          if ls dist | grep -q unsigned; then echo "::error::Unsigned APKs: the signing properties did not apply."; exit 1; fi
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in dist/*.apk; do "$apksigner" verify "$apk"; done
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  release:
    needs: [android]
    # Runs on a dry run too, so the download and the file checks are exercised before a real tag; only the
    # publishing steps are limited to a pushed v* tag.
    runs-on: ubuntu-latest
    # Creating a Release needs write access; new repos default GITHUB_TOKEN to read-only.
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist
      # v0.1.0 was published with no files: the upload pattern matched nothing and the release action only
      # warned. Every expected file must be here before anything is published.
      - name: Release files are all present
        run: |
          missing=""
          for file in app-release.aab app-arm64-v8a-release.apk app-universal-release.apk app-mapping.txt; do
            [ -s "dist/$file" ] || missing="$missing $file"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing release files::Not in the downloaded artifact:$missing"
            find dist -maxdepth 3 -exec ls -ld {} +
            exit 1
          fi
          ls -lh dist
      # The Release body is the hand-written summary in docs/releases/, not a list of commits.
      - name: Release notes exist
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          notes="docs/releases/v$version.md"
          if [ ! -s "$notes" ]; then
            level=warning; [ "$PUBLISH" = true ] && level=error
            echo "::$level title=Missing release notes::Write $notes in the chore(release) pull request."
            [ "$PUBLISH" = true ] && exit 1
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ env.NOTES }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Release has every file
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(ls dist | wc -l)
          attached=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          if [ "$attached" -ne "$expected" ]; then
            echo "::error title=Release incomplete::$GITHUB_REF_NAME has $attached of $expected files attached."
            exit 1
          fi
